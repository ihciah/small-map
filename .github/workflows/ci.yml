name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (stable)
        if: matrix.rust == 'stable'
        run: cargo test --features ahash

      - name: Run tests (nightly)
        if: matrix.rust == 'nightly'
        run: cargo test --features ahash,nightly

  cross-test:
    name: Test on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Run tests
        run: cross test --target ${{ matrix.target }} --features ahash

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, riscv32i-unknown-none-elf

      - name: Check minimal library without std
        run: cargo check --lib --target thumbv7em-none-eabi --no-default-features

      - name: Test hosted library without default features
        run: cargo test --no-default-features --features serde

      - name: Check default and external custom hashers without std
        run: |
          cargo check --manifest-path tests/no-std/Cargo.toml --target thumbv7em-none-eabi
          cargo check --manifest-path tests/no-std/Cargo.toml --target riscv32i-unknown-none-elf

      - name: Build bare-metal default-construction link probes
        run: |
          cargo build --manifest-path tests/no-std/Cargo.toml --target thumbv7em-none-eabi --release
          cargo build --manifest-path tests/no-std/Cargo.toml --target riscv32i-unknown-none-elf --release

      - name: Check no_std hasher aliases
        run: |
          for hasher in fxhash rapidhash ahash; do
            cargo check --manifest-path tests/no-std/Cargo.toml --target thumbv7em-none-eabi --features "$hasher"
          done

      - name: Check serde with external custom hashers
        run: cargo check --manifest-path tests/no-std/Cargo.toml --target thumbv7em-none-eabi --features serde

      - name: Check combined no_std hashers and serde
        run: |
          cargo check --lib --target thumbv7em-none-eabi --no-default-features --features hashes,serde
          cargo check --manifest-path tests/no-std/Cargo.toml --target thumbv7em-none-eabi --features ahash,fxhash,rapidhash,serde

      - name: Install Rust nightly for MSP430 build-std
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - name: Check MSP430 default and external custom hashers
        run: |
          cargo +nightly build --manifest-path tests/no-std/Cargo.toml --lib --target msp430-none-elf -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem
          cargo +nightly check --manifest-path tests/no-std/Cargo.toml --target msp430-none-elf --features serde -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy (stable)
        run: cargo clippy --features ahash -- -D warnings

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Run clippy (nightly)
        run: cargo clippy --features ahash,nightly -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/no-std/Cargo.toml -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc --no-deps --features ahash
        env:
          RUSTDOCFLAGS: -D warnings
