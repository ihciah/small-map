[package]
name = "small-map"
version = "0.1.5"
edition = "2021"

authors = ["ChiHai <ihciah@gmail.com>"]
categories = ["data-structures"]
description = "An inline SIMD accelerated hashmap designed for small amount of data."
keywords = ["smallmap", "hashmap", "map", "simd", "smallvec"]
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/ihciah/small-map"

[dependencies]
hashbrown = { version = "0.16", features = [
    "equivalent",
    "inline-more",
], default-features = false }

serde = { version = "1", default-features = false, optional = true }
ahash = { version = "0.8", default-features = false, optional = true }
rustc-hash = { version = "2", default-features = false, optional = true }
rapidhash = { version = "4", default-features = false, optional = true }

# foldhash 0.2.0 requires pointer-sized atomic loads/stores in no_std builds.
# MSP430 lacks those; its SmallMap/SmallSet defaults use a local deterministic hasher instead.
# Use foldhash directly so Cargo resolver v1 cannot enable it through hashbrown on MSP430.
[target.'cfg(not(target_arch = "msp430"))'.dependencies.foldhash]
version = "0.2.0"
default-features = false

[dev-dependencies]
rand = { version = "0.9" }
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

micromap = "0.1"
tinymap = "0.4"
litemap = "0.8.1"
rustc-hash = { version = "2", features = ["std"] }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["flamegraph"] }

[features]
default = ["std", "rapidhash", "fxhash", "inline-more"]
std = []

hashes = ["ahash", "fxhash", "rapidhash"]
ahash = ["dep:ahash"]
fxhash = ["dep:rustc-hash"]
rapidhash = ["dep:rapidhash"]
serde = ["dep:serde", "hashbrown/serde"]
nightly = []
inline-more = ["hashbrown/inline-more"]

[[bench]]
name = "simple"
harness = false
path = "benches/simple.rs"
required-features = ["fxhash"]

[profile.release]
opt-level = 3
overflow-checks = false
panic = "abort"
lto = true

[profile.bench]
opt-level = 3
overflow-checks = false
panic = "abort"
lto = true
